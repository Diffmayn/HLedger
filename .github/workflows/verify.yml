name: Verify (Supabase + Playwright)

on:
  push:
    branches: [v2]
  workflow_dispatch:
    inputs:
      face:
        description: Run the slow face-placement test
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: |
          supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,mailpit
          supabase status -o env > .supabase.env
          cat .supabase.env | sed 's/^/export /' > .supabase.sh
      - name: Seed demo event (same script developers run locally)
        run: HOST_PASSWORD=ci-password-123 node scripts/local-setup.mjs

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Fake camera clip from the fixture photo
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          ffmpeg -y -loglevel error -loop 1 -i e2e/fixtures/face.jpg -t 6 -r 15 \
            -vf "scale=640:480:force_original_aspect_ratio=increase,crop=640:480,format=yuv420p" e2e/fixtures/face.y4m
          ls -la e2e/fixtures

      - name: Fetch fonts (published to ci-artifacts for committing)
        run: node scripts/fetch-fonts.mjs
        continue-on-error: true

      - name: Build
        run: |
          source .supabase.sh
          VITE_BASE=/ VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_ANON_KEY="$ANON_KEY" npm run build -- --mode development

      - name: Playwright
        id: e2e
        run: |
          set -o pipefail
          source .supabase.sh
          mkdir -p e2e/screens
          VITE_BASE=/ VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_ANON_KEY="$ANON_KEY" \
            E2E_HOST_EMAIL=host@example.com E2E_HOST_PASSWORD=ci-password-123 E2E_FACE=${{ inputs.face && '1' || '' }} \
            npx playwright test --project=desktop --project=booth --reporter=list,json 2>&1 | tee e2e/screens/playwright.txt
        continue-on-error: true

      - name: Publish artifacts to ci-artifacts branch
        if: always()
        run: |
          set -e
          mkdir -p out && cp -r e2e/screens/. out/ 2>/dev/null || true
          cp package-lock.json out/package-lock.json
          mkdir -p out/fonts && cp public/fonts/*.woff2 out/fonts/ 2>/dev/null || true
          cp src/fonts.css out/fonts.css 2>/dev/null || true
          cp test-results/.last-run.json out/last-run.json 2>/dev/null || true
          for f in $(find test-results -name 'error-context.md' 2>/dev/null); do cp "$f" "out/$(basename $(dirname $f)).md"; done
          ls -la out
          cd out
          git init -q -b ci-artifacts
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "artifacts from ${GITHUB_SHA::7} (e2e: ${{ steps.e2e.outcome }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-artifacts

      - name: Fail if e2e failed
        if: steps.e2e.outcome == 'failure'
        run: exit 1
